apiVersion: apps/v1
kind: Deployment
metadata:
  name: coflow-backend
  labels:
    app: coflow-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coflow-backend
  template:
    metadata:
      labels:
        app: coflow-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/jorgevizu4/backend:main-c4ff6fa
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      env:
      - name: DB_HOST
        value: "mysql" 
      - name: DB_PORT
        value: "3306"
      - name: DB_USER
        value: "root"
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: password
      - name: DB_NAME
        value: "coflow"