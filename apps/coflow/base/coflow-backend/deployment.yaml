apiVersion: apps/v1
kind: Deployment
metadata:
  name: coflow-backend
  namespace: coflow
  labels:
    app: coflow-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coflow-backend
  template:
    metadata:
      labels:
        app: coflow-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/jorgevizu4/backend:main-cbd9fa1
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql-service:3306/coflow
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: SPRING_DATASOURCE_PASSWORD