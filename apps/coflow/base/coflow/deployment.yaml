apiVersion: apps/v1
kind: Deployment
metadata:
  name: coflow
  namespace: coflow
  labels:
    app: coflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coflow
  template:
    metadata:
      labels:
        app: coflow
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: coflow
        image: ghcr.io/jorgevizu4/coflow:main-ba39a5d
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        # env vars are handled internally by supervisord (MySQL is embedded in the image)