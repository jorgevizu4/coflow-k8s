apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coflow
  namespace: coflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx 
  rules:
  - host: coflow.192.168.49.2.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coflow
            port:
              number: 80